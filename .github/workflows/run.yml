name: Facturacion Automatica

on:
  schedule:
    # PRUEBA REAL DEL 1 DE SEPTIEMBRE DE 2026:
    # 15:38 UTC = 10:38 Ecuador y 15:47 UTC = 10:47 Ecuador.
    # GitHub Actions schedule usa UTC.
    - cron: '38 15 1 9 *'
    - cron: '47 15 1 9 *'

  workflow_dispatch:
    inputs:
      cliente_id:
        description: Cliente a procesar
        required: true
        default: gloria_pardo
        type: choice
        options:
          - gloria_pardo
          - fcomex
      modo_envio:
        description: PRUEBA no envía; PRODUCCION firma y envía
        required: true
        default: PRUEBA
        type: choice
        options:
          - PRUEBA
          - PRODUCCION

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # En ejecución automática procesa ambos clientes.
    # En ejecución manual procesa únicamente el cliente seleccionado.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cliente_id: ${{ fromJSON(github.event_name == 'schedule' && '["gloria_pardo","fcomex"]' || format('["{0}"]', inputs.cliente_id)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Mostrar configuración
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Cliente: ${{ matrix.cliente_id }}"
          echo "Modo: ${{ github.event_name == 'schedule' && 'PRODUCCION' || inputs.modo_envio }}"

      - name: Ejecutar script
        env:
          SRI_RUC: ${{ secrets.SRI_RUC }}
          SRI_CLAVE: ${{ secrets.SRI_CLAVE }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
          CLIENTE_ID: ${{ matrix.cliente_id }}
          MODO_ENVIO: ${{ github.event_name == 'schedule' && 'PRODUCCION' || inputs.modo_envio }}
        run: python main.py

      - name: Persistir registro anti-duplicado
        if: always()
        run: |
          if ! git diff --quiet -- emisiones.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add emisiones.json
            git commit -m "Registrar resultado de facturacion automatica - ${{ matrix.cliente_id }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sin cambios en emisiones.json"
          fi

      - name: Guardar capturas de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-sri-${{ matrix.cliente_id }}-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
