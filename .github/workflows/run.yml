name: Facturacion Automatica

on:
  schedule:
    - cron: '0 13 1 * *'  # 08:00 Ecuador (UTC-5)
  workflow_dispatch:
    inputs:
      cliente_id:
        description: Cliente a procesar
        required: true
        default: gloria_pardo
        type: choice
        options:
          - gloria_pardo
          - fcomex
      modo_envio:
        description: PRUEBA no envía; PRODUCCION firma y envía
        required: true
        default: PRUEBA
        type: choice
        options:
          - PRUEBA
          - PRODUCCION

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar script
        env:
          SRI_RUC: ${{ secrets.SRI_RUC }}
          SRI_CLAVE: ${{ secrets.SRI_CLAVE }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
          CLIENTE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.cliente_id || 'gloria_pardo' }}
          MODO_ENVIO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_envio || 'PRUEBA' }}
        run: python main.py

      - name: Persistir registro anti-duplicado
        if: always()
        run: |
          if ! git diff --quiet -- emisiones.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add emisiones.json
            git commit -m "Registrar resultado de facturacion automatica [skip ci]"
            git push
          else
            echo "Sin cambios en emisiones.json"
          fi

      - name: Guardar capturas de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-sri-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
