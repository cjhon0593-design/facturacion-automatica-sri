name: Bootstrap Facturacion Septiembre 2026

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-sept-2026.yml'

permissions:
  contents: write

jobs:
  facturar:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cliente_id: [gloria_pardo, fcomex]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar facturacion real
        env:
          SRI_RUC: ${{ secrets.SRI_RUC }}
          SRI_CLAVE: ${{ secrets.SRI_CLAVE }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
          CLIENTE_ID: ${{ matrix.cliente_id }}
          MODO_ENVIO: PRODUCCION
        run: python main.py

      - name: Persistir registro anti-duplicado
        if: always()
        run: |
          if ! git diff --quiet -- emisiones.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add emisiones.json
            git commit -m "Registrar facturacion septiembre 2026 - ${{ matrix.cliente_id }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sin cambios en emisiones.json"
          fi

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-septiembre-${{ matrix.cliente_id }}-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
